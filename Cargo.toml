[package]
name = "tui-preview"
version = "0.1.0"
edition = "2021"
description = "Pure Rust TUI universal file previewer - lightweight, fast, cached, keyboard-driven"
license = "MIT"
authors = ["VIJAY"]
repository = "https://github.com/Rohithdgrr/R-PREV"
keywords = ["tui", "preview", "ratatui", "file-manager"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
# UI + Runtime - trimmed tokio features (no net/signal/process) for lightweight binary
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1.16"

# FS + Search
walkdir = "2"
ignore = "0.4"
mime_guess = "2"
infer = "0.19"
nucleo-matcher = "0.3"
sha2 = "0.10"
hex = "0.4"
lru = "0.12"
notify = { version = "6", optional = true }
memmap2 = "0.9"

# Text / CSV / Markdown
syntect = "5"
csv = "1"
comfy-table = "7"
pulldown-cmark = "0.12"
encoding_rs = "0.8"
content_inspector = "0.2"

# Images (pure Rust)
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.43"
usvg = "0.43"

# PDF - pure Rust text extraction; raster via pdfium-render (Apache-2.0, not AGPL)
# NOTE: mupdf removed - it is AGPL-3.0 and conflicts with MIT license + cargo deny policy
lopdf = "0.35"
pdf-extract = "0.8"
pdfium-render = { version = "0.8", optional = true }

# Office (pure Rust) - docx/xlsx via crates, pptx via zip+quick-xml (pptx-rs is abandoned)
docx-rs = "0.4"
calamine = "0.26"
zip = "2"
quick-xml = "0.36"

# Archive preview (uses existing zip)
tar = "0.4"
flate2 = "1"

# Audio (pure Rust)
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
hound = "3"

# System open (only Command spawn allowed, for `o` key)
open = "5"

# Video — feature-gated (pure Rust header vs ffmpeg binding)
ffmpeg-next = { version = "7", optional = true }
mp4 = { version = "0.14", optional = true }

# Git-aware file badges (pure Rust, no binary)
gix = { version = "0.66", optional = true, default-features = false, features = ["status"] }
anyhow = "1.0.104"
futures = "0.3.34"
directories-next = "2.0.0"
tokio-util = "0.7.19"

[features]
default = []
# pdf-raster now uses pdfium-render (Apache-2.0) not mupdf (AGPL-3.0)
pdf-raster = ["pdfium-render"]
video = ["ffmpeg-next"]
video-pure = ["mp4"]
watch = ["notify"]
git = ["gix"]
full = ["pdf-raster", "video", "watch", "git"]

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort" REMOVED — must keep unwind so catch_unwind in spawn_blocking works
# See SECURITY.md §5 and review: abort disables catch_unwind and crashes on malformed files
opt-level = 3

[profile.release-with-debug]
inherits = "release"
strip = false
debug = 1

[lints.clippy]
disallowed_methods = "deny"

# cargo clippy will read clippy.toml for disallowed-methods list (Command::new)
