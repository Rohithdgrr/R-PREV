[package]
name = "tui-preview"
version = "0.1.0"
edition = "2021"
description = "Pure Rust TUI universal file previewer - lightweight, fast, cached, keyboard-driven"
license = "MIT"
authors = ["VIJAY"]
repository = "https://github.com/Rohithdgrr/R-PREV"
keywords = ["tui", "preview", "ratatui", "file-manager"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
# UI + Runtime
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# FS + Search
walkdir = "2"
ignore = "0.4"
mime_guess = "2"
infer = "0.19"
nucleo-matcher = "0.3"
sha2 = "0.10"
hex = "0.4"
lru = "0.12"

# Text / CSV / Markdown
syntect = "5"
csv = "1"
comfy-table = "7"
pulldown-cmark = "0.12"
encoding_rs = "0.8"
content_inspector = "0.2"

# Images (pure Rust)
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.43"
usvg = "0.43"

# PDF (pure Rust text; raster is feature-gated)
lopdf = "0.35"
pdf-extract = "0.8"
mupdf = { version = "0.4", optional = true }

# Office (pure Rust)
docx-rs = "0.4"
calamine = "0.26"
zip = "2"

# Audio (pure Rust)
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
hound = "3"

# System open (only Command spawn allowed, for `o` key)
open = "5"

# Video — feature-gated
ffmpeg-next = { version = "7", optional = true }
mp4 = { version = "0.14", optional = true }

[features]
default = []
pdf-raster = ["mupdf"]
video = ["ffmpeg-next"]
video-pure = ["mp4"]
full = ["pdf-raster", "video"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
strip = false
debug = 1

[lints.clippy]
disallowed_methods = "deny"

# cargo clippy will read clippy.toml for disallowed-methods list (Command::new)
